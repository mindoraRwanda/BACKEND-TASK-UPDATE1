name: Lockfile Ubuntu Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/lockfile-check.yml'
      - 'extracted_all/Mindora_V3-main/package-lock.json'
      - 'extracted_all/Mindora_V3-main/package.json'
      - 'extracted_all/Mindora_V3-main/apps/*/package.json'
      - 'extracted_all/Mindora_V3-main/packages/*/package.json'

permissions:
  contents: read

defaults:
  run:
    working-directory: extracted_all/Mindora_V3-main

jobs:
  ubuntu-npm-ci:
    name: Ubuntu npm ci (optional dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3

      - name: Install npm 10.9.2
        run: npm install --global npm@10.9.2

      - name: Verify toolchain versions
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v24.22.3"
          test "$(npm --version)" = "10.9.2"

      - name: Install dependencies with optional packages
        run: npm ci --include=optional
